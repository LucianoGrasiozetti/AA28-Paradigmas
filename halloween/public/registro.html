<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro | Concurso de disfraces</title>
<meta name="description" content="Concurso de disfraces de Halloween: registrate y votá por tu favorito.">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<a href="#contenido" class="skip-link">Saltar al contenido</a>
<header>
<p class="marca"><span aria-hidden="true">🎃</span> Concurso de disfraces</p>
<nav id="nav" aria-label="Principal"></nav>
</header>
<main id="contenido">
<h1>Crear cuenta</h1>
<p id="estado" class="estado" role="status" aria-live="polite"></p>
<form id="form">
<label for="nombre">Nombre de usuario (3 a 50 caracteres)</label>
<input id="nombre" name="nombre" type="text" minlength="3" maxlength="50" autocomplete="username" required>
<label for="clave">Contraseña</label>
<input id="clave" name="clave" type="password" minlength="8" autocomplete="new-password" aria-describedby="ayuda-clave" required>
<p id="ayuda-clave">Mínimo 8 caracteres.</p>
<button type="submit">Crear cuenta</button>
</form>
<p>¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a>.</p>
</main>
<footer><p>Proyecto de Halloween con API REST en PHP y MySQL.</p></footer>
<script type="module" src="js/registro.js"></script>
</body>
</html>
