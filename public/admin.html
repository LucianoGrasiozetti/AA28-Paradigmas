<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Administración | Concurso de disfraces</title>
    <meta
      name="description"
      content="Concurso de disfraces de Halloween: registrate y votá por tu favorito."
    />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <a href="#contenido" class="skip-link">Saltar al contenido</a>
    <header>
      <p class="marca">
        <span aria-hidden="true">🎃</span> Concurso de disfraces
      </p>
      <nav id="nav" aria-label="Principal"></nav>
    </header>
    <main id="contenido">
      <h1>Administración de disfraces</h1>
      <p id="estado" class="estado" role="status" aria-live="polite"></p>
      <section aria-labelledby="titulo-form">
        <h2 id="titulo-form">Nuevo disfraz</h2>
        <form id="form">
          <input type="hidden" name="id_disfraz" />
          <label for="nombre">Nombre</label>
          <input
            id="nombre"
            name="nombre"
            type="text"
            maxlength="50"
            required
          />
          <label for="descripcion">Descripción</label>
          <textarea
            id="descripcion"
            name="descripcion"
            rows="4"
            required
          ></textarea>
          <label for="foto">Foto (JPG, PNG, WEBP o GIF, hasta 5 MB)</label>
          <input
            id="foto"
            name="foto"
            type="file"
            accept="image/jpeg,image/png,image/webp,image/gif"
          />
          <button type="submit">Guardar disfraz</button>
          <button type="button" id="cancelar" hidden>Cancelar edición</button>
        </form>
      </section>
      <div class="tabla">
        <table>
          <caption>
            Disfraces registrados
          </caption>
          <thead>
            <tr>
              <th scope="col">Nombre</th>
              <th scope="col">Descripción</th>
              <th scope="col">Votos</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <tbody id="cuerpo"></tbody>
        </table>
      </div>
    </main>
    <footer><p>Proyecto de Halloween con API REST en PHP y MySQL.</p></footer>
    <script type="module" src="js/admin.js"></script>
  </body>
</html>
